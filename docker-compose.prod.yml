services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput
      && python manage.py collectstatic --noinput
      && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "0"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=5)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  proxy:
    image: nginx:1.27-alpine
    env_file:
      - .env
    environment:
      PROXY_SERVER_NAME: ${PROXY_SERVER_NAME}
      NGINX_ENVSUBST_TEMPLATE_SUFFIX: .template
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${PROXY_TLS_CERT_PATH}:/etc/nginx/certs/server.crt:ro
      - ${PROXY_TLS_KEY_PATH}:/etc/nginx/certs/server.key:ro
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-check-certificate -q -O - https://127.0.0.1/healthz/ >/dev/null 2>&1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  bot:
    build: .
    command: python -m botapp.bot
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "0"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      proxy:
        condition: service_healthy

  worker:
    build: .
    command: celery -A config worker -l INFO
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "0"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      proxy:
        condition: service_healthy

  beat:
    build: .
    command: celery -A config beat -l INFO
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "0"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      proxy:
        condition: service_healthy

volumes:
  db_data:
